[project]
name = "stroop-rnn"
version = "0.1.0"
description = "Learning history, Stroop interference and asymmetric switch costs: a dynamical-systems analysis of trained recurrent networks (CG-501 project)"
authors = [{ name = "Vishnu Sinha" }, { name = "Devashish Gaur" }]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stroop_rnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
